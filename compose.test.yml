services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lottery_test
      POSTGRES_USER: lottery_test
      POSTGRES_PASSWORD: lottery_test_only
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lottery_test -d lottery_test']
      interval: 2s
      timeout: 2s
      retries: 15
